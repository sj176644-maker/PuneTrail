<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PuneTrail</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#1f2a22;--mut:#5f6b62;--g:#1f4d36;--g2:#2f6b4c;--o:#d9741f;--st:#e8dfcf;--warn:#fff1dd;--ring:#d9741f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b261f;--ink:#eee8da;--mut:#a3aea5;--g:#7fc29b;--g2:#5aa57b;--st:#2b3a30;--warn:#3a2c17}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1b261f;--ink:#eee8da;--mut:#a3aea5;--g:#7fc29b;--g2:#5aa57b;--st:#2b3a30;--warn:#3a2c17}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header b{font-size:20px}header small{display:block;opacity:.8;font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:none;border:0;color:#fff;padding:8px 12px;border-radius:20px;cursor:pointer}
nav button[aria-current=page]{background:#ffffff30}
main{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:20px;padding:28px 22px}
.hero h1{margin:0 0 8px;font-size:clamp(26px,5vw,40px)}
.btn{background:var(--o);color:#fff;border:0;border-radius:24px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 0 0}
.btn.alt{background:var(--st);color:var(--ink)}.btn.sm{padding:5px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--st);border-radius:16px;padding:14px}
.card h3{margin:0 0 4px}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--st);border-radius:12px;padding:1px 9px;font-size:12px;margin-right:4px}
.warn{background:var(--warn);border-left:4px solid var(--o);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label{font-size:14px;display:flex;flex-direction:column;gap:2px}
input,select{background:var(--card);border:1px solid var(--st);border-radius:10px;padding:8px}
svg.map{width:100%;height:auto;background:var(--st);border-radius:16px}
.chip{cursor:pointer;border:2px solid var(--st);background:var(--card);border-radius:20px;padding:4px 12px;font-size:14px}
.chip[aria-pressed=true]{border-color:var(--g);background:var(--g);color:#fff}
.tl{list-style:none;padding:0}.tl li{background:var(--card);border:1px solid var(--st);border-radius:14px;padding:10px 12px;margin:8px 0}
.done{opacity:.6;text-decoration:line-through}
.bar{height:10px;background:var(--st);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g2)}
h2{margin-top:24px}
</style></head><body>
<header><div><b>⛰ PuneTrail</b><small>Explore Pune. Discover Forts. Find Your Trail.</small></div>
<nav aria-label="Main" id="nav"></nav></header>
<main id="app"></main>
<script>
const CATS={heritage:['Heritage','#8a5a2b'],fort:['Fort / Trek','#1f4d36'],nature:['Nature','#2a7fb8'],spiritual:['Spiritual','#8e44ad']};
// Approximate coordinates; durations are rough estimates, not verified facts.
const D=[
{id:'shaniwar',n:'Shaniwar Wada',c:'heritage',lat:18.5195,lng:73.8553,dur:90,d:'Historic Peshwa-era fortification in old Pune.',w:'Check current timings and entry rules before visiting.'},
{id:'aga',n:'Aga Khan Palace',c:'heritage',lat:18.5522,lng:73.9016,dur:90,d:'Landmark palace and memorial in Yerawada.',w:'Check current timings before visiting.'},
{id:'dagdu',n:'Dagdusheth Halwai Ganpati Temple',c:'spiritual',lat:18.5164,lng:73.8561,dur:45,d:'Well-known Ganpati temple in central Pune; can be crowded.',w:'Expect queues on festival days.'},
{id:'parvati',n:'Parvati Hill',c:'spiritual',lat:18.4966,lng:73.8426,dur:90,d:'Hilltop temple complex with city views, reached by steps.',w:'Steps are steep; avoid midday heat.'},
{id:'khada',n:'Khadakwasla Dam',c:'nature',lat:18.4420,lng:73.7660,dur:75,d:'Reservoir and dam viewpoint on Pune\'s edge.',w:'Check local advisories during monsoon.'},
{id:'sinha',n:'Sinhagad Fort',c:'fort',lat:18.3663,lng:73.7558,dur:240,trek:1,diff:'Moderate',tt:'~1.5–2.5 h up (estimate)',start:'Foothill (Atkarwadi) trail or drive-up road, as access allows',d:'Hill fort southwest of Pune, popular for day treks.',w:'Access/vehicle rules can change; verify locally.'},
{id:'rajgad',n:'Rajgad Fort',c:'fort',lat:18.2465,lng:73.6827,dur:420,trek:1,diff:'Moderate–Hard',tt:'Multiple hours; long day (estimate)',start:'Gunjavane or Pali villages (common routes)',d:'Large former capital fort in the Sahyadris.',w:'Long trek; start early, carry plenty of water.'},
{id:'torna',n:'Torna Fort',c:'fort',lat:18.2766,lng:73.6221,dur:360,trek:1,diff:'Moderate–Hard',tt:'~2–3 h up (estimate)',start:'Velhe/Bhatti village side',d:'High-altitude fort known for steep climbs and views.',w:'Slippery and exposed in monsoon; verify access.'},
{id:'purandar',n:'Purandar Fort',c:'fort',lat:18.2858,lng:73.9786,dur:240,trek:1,diff:'Easy–Moderate',tt:'~1–2 h (estimate)',start:'Narayanpur side',d:'Twin-fort complex southeast of Pune.',w:'Parts may be restricted; check locally.'},
{id:'lohagad',n:'Lohagad Fort',c:'fort',lat:18.7106,lng:73.4764,dur:210,trek:1,diff:'Easy–Moderate',tt:'~1–1.5 h (estimate)',start:'Lohagadwadi',d:'Fort near Lonavala/Malavli, stepped route.',w:'Crowded and slippery on monsoon weekends.'},
{id:'visapur',n:'Visapur Fort',c:'fort',lat:18.7143,lng:73.4837,dur:210,trek:1,diff:'Moderate',tt:'~1.5–2 h (estimate)',start:'Bhaje / Visapur village',d:'Neighbour of Lohagad; often paired with it.',w:'Steep, slippery rock in rain.'}];
const HOME={n:'Pune city centre (default start)',lat:18.5204,lng:73.8567};
const SPD={car:40,bike:35,public:22,taxi:40,walk:4};
const $=s=>document.querySelector(s),get=id=>D.find(x=>x.id==id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={page:'home',sel:new Set(),cats:new Set(Object.keys(CATS)),origin:HOME,focus:null,trip:null,saved:ls.get('pt_saved',[]),msg:''};
const km=(a,b)=>{const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lng-a.lng)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const road=(a,b)=>km(a,b)*1.4;
const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const gm=(q)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const gpin=p=>`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
function pageNav(p){S.page=p;render();window.scrollTo(0,0)}
// ---------- itinerary ----------
function recalc(t){let loc=t.origin,m=t.startMin,tot=0;
 t.stops.forEach(s=>{const p=s.kind=='meal'?loc:s;s.km=s.kind=='meal'?0:road(loc,p);s.travel=Math.round(s.km/SPD[t.mode]*60);m+=s.travel;s.arr=m;m+=s.dur;s.dep=m;if(s.kind!='meal')loc=s});
 t.retKm=road(loc,t.origin);t.retMin=Math.round(t.retKm/SPD[t.mode]*60);t.end=m+t.retMin;
 t.warns=[];const trek=t.stops.some(s=>s.trek);
 if(t.end>18.5*60&&trek)t.warns.push('Trek plan ends after ~18:30. Don\'t trek after dark — start earlier or drop a stop.');
 if(t.end-t.startMin>12*60)t.warns.push('Over 12 hours total — likely too ambitious for one day. Consider splitting across a weekend.');
 if(t.stops.filter(s=>s.trek).length>1)t.warns.push('Multiple treks in one day is rarely realistic; consider separate days.');
 if(t.mode=='public'&&trek)t.warns.push('Public transport to fort trailheads is limited; check schedules locally.');
 if(t.stops.some(s=>s.trek))t.warns.push('Monsoon/rain: check official weather alerts and local access rules before leaving.');}
function generate(){const f=document.forms.w,o=S.origin;let pool=[...S.sel].map(get),order=[],cur=o;
 while(pool.length){pool.sort((a,b)=>road(cur,a)-road(cur,b));cur=pool.shift();order.push(cur)}
 const t={id:'t'+Date.now(),name:f.name.value||'My Pune Adventure',origin:o,mode:f.mode.value,startMin:+f.start.value.split(':')[0]*60+ +f.start.value.split(':')[1],date:f.date.value,people:f.people.value,done:{},stops:order.map(d=>({id:d.id,n:d.n,lat:d.lat,lng:d.lng,dur:d.dur,trek:d.trek,kind:'place'}))};
 recalc(t);
 if(t.end>=13*60&&t.startMin<13*60&&!t.stops.some(s=>s.kind=='meal')){let i=t.stops.findIndex(s=>s.arr>=12.5*60);if(i<0)i=t.stops.length;t.stops.splice(i,0,{id:'m'+Date.now(),n:'Lunch break (find a place via Google Maps)',kind:'meal',dur:60});recalc(t)}
 S.trip=t;S.page='trip';render()}
function mapsLinks(t){const pts=[t.origin,...t.stops.filter(s=>s.kind!='meal'),t.origin].map(p=>p.lat+','+p.lng),out=[];
 for(let i=0;i<pts.length-1;i+=10){const ch=pts.slice(i,i+11);if(ch.length<2)break;out.push(`https://www.google.com/maps/dir/?api=1&origin=${ch[0]}&destination=${ch.at(-1)}&travelmode=${{car:'driving',taxi:'driving',bike:'two-wheeler',public:'transit',walk:'walking'}[t.mode]}`+(ch.length>2?'&waypoints='+ch.slice(1,-1).join('%7C'):''))}return out}
function summary(t){return `${t.name}${t.date?' ('+t.date+')':''}\n`+t.stops.map((s,i)=>`${i+1}. ${fmt(s.arr)}–${fmt(s.dep)} ${s.n}`).join('\n')+`\nEstimated return ~${fmt(t.end)}. Times are estimates, not guarantees.`}
// ---------- views ----------
function mapSvg(list,tripStops){const W=700,H=620,X=l=>(l-73.4)/0.62*W,Y=l=>(18.78-l)/0.6*H;
 let s=`<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Schematic map of Pune region destinations">`;
 s+=`<text x="10" y="20" font-size="12" fill="var(--mut)">Schematic map (positions approximate, not tiles)</text>`;
 if(tripStops){let pts=[S.trip.origin,...tripStops,S.trip.origin];s+=`<polyline points="${pts.map(p=>X(p.lng)+','+Y(p.lat)).join(' ')}" fill="none" stroke="var(--o)" stroke-width="3" stroke-dasharray="6 4"/>`}
 s+=`<g><circle cx="${X(S.origin.lng)}" cy="${Y(S.origin.lat)}" r="9" fill="#d9741f" stroke="#fff" stroke-width="2"/><text x="${X(S.origin.lng)+12}" y="${Y(S.origin.lat)+4}" font-size="12" fill="var(--ink)">Start</text></g>`;
 list.forEach(d=>{s+=`<g tabindex="0" role="button" aria-label="${esc(d.n)}" style="cursor:pointer" onclick="S.focus='${d.id}';render()" onkeydown="if(event.key=='Enter'){S.focus='${d.id}';render()}"><circle cx="${X(d.lng)}" cy="${Y(d.lat)}" r="${S.focus==d.id?11:8}" fill="${(CATS[d.c]||['','#1f4d36'])[1]}" stroke="#fff" stroke-width="2"/><text x="${X(d.lng)+11}" y="${Y(d.lat)+4}" font-size="11" fill="var(--ink)">${esc(d.n.split(' ').slice(0,2).join(' '))}</text></g>`});
 return s+'</svg>'}
function dCard(d){const dist=road(S.origin,d);return `<div class="card"><h3>${esc(d.n)}</h3><span class="tag">${CATS[d.c][0]}</span>${d.diff?`<span class="tag">${d.diff}</span>`:''}<p>${esc(d.d)}</p><p class="mut">≈${dist.toFixed(0)} km by road (straight-line ×1.4, estimate) · visit ~${Math.round(d.dur/60*10)/10} h (estimate)</p><div class="warn">⚠ ${esc(d.w)}</div><button class="btn sm" onclick="toggleSel('${d.id}')">${S.sel.has(d.id)?'✓ In itinerary (remove)':'+ Add to itinerary'}</button> <a class="btn sm alt" target="_blank" rel="noopener" href="${gpin(d)}">Open in Google Maps</a></div>`}
function toggleSel(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render()}
function nearMe(){if(!navigator.geolocation){S.msg='Geolocation not supported. Pick a start manually.';render();return}
 navigator.geolocation.getCurrentPosition(p=>{S.origin={n:'My location',lat:p.coords.latitude,lng:p.coords.longitude};S.msg='';render()},()=>{S.msg='Location denied — choose a starting point below.';render()})}
function startSel(){return `<label>Starting location<select onchange="S.origin=this.value=='home'?HOME:(o=>({n:o.n,lat:o.lat,lng:o.lng}))(get(this.value));render()"><option value="home">${S.origin.n=='My location'?'My location (current)':'Pune city centre'}</option>${D.map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select></label><button class="btn alt" onclick="nearMe()">📍 Near Me</button>`}
function home(){return `<div class="hero"><h1>Your Pune Adventure Starts Here.</h1><p>Discover Pune's heritage, explore legendary forts, and plan a realistic day trip — all in one place.</p><form onsubmit="event.preventDefault();homeSearch(this.q.value)" class="row"><label style="color:#fff">Search a destination<input name="q" placeholder="e.g. Sinhagad"></label><button class="btn">Search</button></form>${S.msg?`<div class="warn" style="color:#1f2a22">${S.msg}</div>`:''}<button class="btn" onclick="pageNav('plan')">Plan My Trip</button><button class="btn alt" onclick="pageNav('explore')">Explore Pune</button></div>
<h2>Discover</h2><div class="grid">${Object.entries(CATS).map(([k,v])=>`<div class="card"><h3>${v[0]}</h3><p class="mut">${D.filter(d=>d.c==k).length} places</p><button class="btn sm" onclick="S.cats=new Set(['${k}']);pageNav('explore')">Browse</button></div>`).join('')}</div>
<h2>How it works</h2><div class="grid"><div class="card"><b>1. Choose</b><p class="mut">Pick destinations on the map or list.</p></div><div class="card"><b>2. Build</b><p class="mut">We order stops and estimate timings.</p></div><div class="card"><b>3. Track</b><p class="mut">Tick checkpoints; progress is saved in this browser.</p></div></div>
<h2>Sample itineraries (suggestions only)</h2><div class="grid">${[['Pune Heritage Day',['shaniwar','dagdu','aga']],['Sinhagad Adventure',['sinha','khada']],['Fort Weekend (Torna + Rajgad: split over 2 days)',['torna']],['Nature Escape',['khada','parvati']]].map(([n,ids])=>`<div class="card"><h3>${n}</h3><p class="mut">${ids.map(i=>get(i).n).join(' → ')}</p><button class="btn sm" onclick="S.sel=new Set(${JSON.stringify(ids)});pageNav('plan')">Load &amp; edit</button></div>`).join('')}</div>`}
function explore(){const list=D.filter(d=>S.cats.has(d.c)),f=get(S.focus);
 return `<h2>Explore map</h2><div class="row">${Object.entries(CATS).map(([k,v])=>`<button class="chip" aria-pressed="${S.cats.has(k)}" onclick="S.cats.has('${k}')?S.cats.delete('${k}'):S.cats.add('${k}');render()"><span style="color:${v[1]}">●</span> ${v[0]}</button>`).join('')}</div><div class="row">${startSel()}</div>${S.msg?`<div class="warn">${S.msg}</div>`:''}
 ${mapSvg(list)}${f?`<div style="margin-top:10px">${dCard(f)}</div>`:''}<h2>List view</h2>${list.length?`<div class="grid">${list.map(dCard).join('')}</div>`:'<p class="mut">No categories selected.</p>'}
 <p class="mut">Map note: this offline build draws a schematic map; real tiles/Google Maps need a hosted app with API keys. "Open in Google Maps" opens an external page.</p>`}
function plan(){const now=new Date().toISOString().slice(0,10);
 return `<h2>Plan a trip</h2><form name="w" onsubmit="event.preventDefault();if(!S.sel.size){S.msg='Select at least one destination.';render();return}generate()"><div class="row">
 <label>Trip name<input name="name" value="My Pune Adventure" maxlength="60"></label><label>Date<input type="date" name="date" value="${now}"></label><label>Start time<input type="time" name="start" value="07:00" required></label><label>Travelers<input type="number" name="people" min="1" max="50" value="2"></label>
 <label>Transport<select name="mode"><option value="car">Personal vehicle</option><option value="bike">Two-wheeler</option><option value="taxi">Taxi</option><option value="public">Public transport</option></select></label>${startSel()}</div>
 ${S.msg?`<div class="warn">${S.msg}</div>`:''}<h3>Select destinations (${S.sel.size})</h3><div class="grid">${D.map(d=>`<div class="card"><b>${esc(d.n)}</b><div class="mut">${CATS[d.c][0]} · ~${Math.round(d.dur/60*10)/10} h · ${road(S.origin,d).toFixed(0)} km</div><div class="warn">⚠ ${esc(d.w)}</div><button type="button" class="btn sm" onclick="toggleSel('${d.id}')">${S.sel.has(d.id)?'Remove':'Add'}</button></div>`).join('')}</div>
 <p><button class="btn">Generate itinerary</button></p></form>`}
function trip(){const t=S.trip;if(!t)return '<p>No itinerary yet. <a href="#" onclick="pageNav(\'plan\');return false">Plan a trip</a>.</p>';
 const n=t.stops.length,dn=t.stops.filter(s=>t.done[s.id]).length,nx=t.stops.find(s=>!t.done[s.id]),links=mapsLinks(t);
 return `<h2>${esc(t.name)}</h2><div class="mut">${t.date||''} · ${t.people} traveler(s) · all times are estimates from straight-line×1.4 road factor, not live routing</div>
 ${t.warns.map(w=>`<div class="warn">⚠ ${w}</div>`).join('')}
 <div class="card"><b>${dn} of ${n} checkpoints completed (${n?Math.round(dn/n*100):0}%)</b><div class="bar"><i style="width:${n?dn/n*100:0}%"></i></div><div class="mut">${nx?'Next: '+esc(nx.n):'All done 🎉'}</div></div>
 <div class="row"><label>Transport<select onchange="S.trip.mode=this.value;recalc(S.trip);render()">${[['car','Personal vehicle'],['bike','Two-wheeler'],['taxi','Taxi'],['public','Public transport']].map(([v,l])=>`<option value="${v}" ${t.mode==v?'selected':''}>${l}</option>`).join('')}</select></label><label>Add stop<select onchange="addStop(this.value)"><option value="">Choose…</option>${D.filter(d=>!t.stops.some(s=>s.id==d.id)).map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select></label><button class="btn alt sm" onclick="addMeal()">+ Meal break</button><label>Overnight stay<select onchange="addStay(this.value)"><option value="">Add stay near…</option>${t.stops.filter(s=>s.kind=='place').map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</select></label></div>
 <ol class="tl"><li class="mut">Start: ${esc(t.origin.n)} ${fmt(t.startMin)}</li>${t.stops.map((s,i)=>`<li><label style="flex-direction:row;gap:8px;align-items:center"><input type="checkbox" ${t.done[s.id]?'checked':''} onchange="chk('${s.id}')" aria-label="Done: ${esc(s.n)}"><b class="${t.done[s.id]?'done':''}">${esc(s.n)}</b></label><div class="mut">Arrive ${fmt(s.arr)} · depart ${fmt(s.dep)} · stay ${s.dur} min${s.kind!='meal'?` · travel ~${s.travel} min (~${s.km.toFixed(0)} km)`:''}</div><div class="row"><button class="btn alt sm" ${i==0?'disabled':''} onclick="mv(${i},-1)" aria-label="Move up">↑</button><button class="btn alt sm" ${i==n-1?'disabled':''} onclick="mv(${i},1)" aria-label="Move down">↓</button><button class="btn alt sm" onclick="rm(${i})">Remove</button>${s.kind=='meal'?'':`<a class="btn alt sm" target="_blank" rel="noopener" href="${gm('restaurants near '+s.lat+','+s.lng)}">Food near here</a>`}</div></li>`).join('')}<li class="mut">Return to start ~${t.retMin} min · finish ~${fmt(t.end)}</li></ol>
 <h3>Route (schematic)</h3>${mapSvg(t.stops.filter(s=>s.kind!='meal'),t.stops.filter(s=>s.kind!='meal'))}
 <div class="row"><button class="btn" onclick="save()">Save trip</button><button class="btn alt" onclick="navigator.clipboard.writeText(summary(S.trip)).then(()=>{S.msg='Summary copied.';render()}).catch(()=>{S.msg='Copy failed; select text manually.';render()})">Copy summary</button>${links.map((l,i)=>`<a class="btn alt" target="_blank" rel="noopener" href="${l}">Open in Google Maps${links.length>1?' (part '+(i+1)+')':''}</a>`).join('')}</div>${S.msg?`<div class="mut">${S.msg}</div>`:''}
 <p class="mut">Opens Google Maps externally (not embedded). Long routes are split into parts due to waypoint limits. Saved trips stay in this browser only.</p>`}
function addStop(id){if(!id)return;const d=get(id);S.trip.stops.push({id:d.id,n:d.n,lat:d.lat,lng:d.lng,dur:d.dur,trek:d.trek,kind:'place'});recalc(S.trip);render()}
function addStay(id){if(!id)return;const p=S.trip.stops.find(s=>s.id==id);S.trip.stops.push({id:'s'+Date.now(),n:'Overnight stay near '+p.n+' (pick a place via Google Maps)',kind:'meal',stay:1,dur:600});recalc(S.trip);S.trip.warns.unshift('Overnight stay added: timeline continues next day; no property or price is confirmed — book separately.');render()}
function addMeal(){S.trip.stops.push({id:'m'+Date.now(),n:'Meal break (search via Google Maps)',kind:'meal',dur:60});recalc(S.trip);render()}
function homeSearch(v){const q=v.trim().toLowerCase();const r=D.find(d=>d.n.toLowerCase().includes(q));if(!q||!r){S.msg='No match. Try "Sinhagad" or "Wada".';render();return}S.focus=r.id;S.cats=new Set(Object.keys(CATS));S.msg='';pageNav('explore')}
function mv(i,d){const a=S.trip.stops;[a[i],a[i+d]]=[a[i+d],a[i]];recalc(S.trip);render()}
function rm(i){S.trip.stops.splice(i,1);recalc(S.trip);render()}
function chk(id){const t=S.trip;t.done[id]=!t.done[id];persist();render()}
function persist(){const i=S.saved.findIndex(x=>x.id==S.trip.id);if(i>=0){S.saved[i]=S.trip;ls.set('pt_saved',S.saved)}}
function save(){const i=S.saved.findIndex(x=>x.id==S.trip.id);i>=0?S.saved[i]=S.trip:S.saved.push(S.trip);ls.set('pt_saved',S.saved);S.msg='Saved in this browser.';render()}
function forts(){return `<h2>Forts &amp; Treks</h2><div class="warn"><b>Safety first.</b> Check official weather alerts and local access rules before leaving. Avoid heavy rain, slippery rock and poor visibility; never start late or trek alone unprepared. Mobile signal is limited. This site is not a substitute for emergency services or local guides. Durations/difficulty below are rough guidance, not verified measurements.</div>
 ${D.filter(d=>d.trek).map(d=>`<div class="card" style="margin:10px 0"><h3>${esc(d.n)}</h3><span class="tag">${d.diff}</span><p>${esc(d.d)}</p><p class="mut"><b>Typical trek:</b> ${d.tt}<br><b>Common start:</b> ${esc(d.start)}<br><b>Distance from Pune:</b> ≈${road(HOME,d).toFixed(0)} km (straight-line×1.4, estimate)</p><div class="warn">⚠ ${esc(d.w)}</div><details><summary>Preparation checklist</summary><ul><li>Sturdy grip footwear</li><li>2–3 L water, snacks, electrolytes</li><li>Rain gear, torch, power bank, first aid</li><li>Tell someone your plan; descend before dark</li></ul></details><button class="btn sm" onclick="toggleSel('${d.id}');pageNav('plan')">Plan this</button> <a class="btn sm alt" target="_blank" rel="noopener" href="${gm('restaurants near '+d.n)}">Food nearby (Google Maps)</a> <a class="btn sm alt" target="_blank" rel="noopener" href="${gm('stay near '+d.n)}">Stay nearby</a> <a class="btn sm alt" target="_blank" rel="noopener" href="${gpin(d)}">Navigate</a></div>`).join('')}`}
function food(){return `<h2>Food &amp; Stay</h2><div class="warn">Live listings, ratings, hours and prices need a places API (e.g. Google Places with a key). This offline build does not invent any — these buttons open live Google Maps searches around each destination.</div><div class="grid">${D.map(d=>`<div class="card"><b>${esc(d.n)}</b><div class="row"><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('breakfast near '+d.n)}">Breakfast</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('vegetarian restaurants near '+d.n)}">Veg</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('Maharashtrian food near '+d.n)}">Local</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('cafes near '+d.n)}">Cafes</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('hotels near '+d.n)}">Hotels</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gm('homestay near '+d.n)}">Homestays</a></div></div>`).join('')}</div>`}
function savedPg(){return `<h2>Saved trips</h2>${S.saved.length?S.saved.map((t,i)=>{const n=t.stops.length,dn=t.stops.filter(s=>t.done[s.id]).length;return `<div class="card" style="margin:8px 0"><b>${esc(t.name)}</b><div class="mut">${dn} of ${n} checkpoints completed</div><div class="bar"><i style="width:${n?dn/n*100:0}%"></i></div><div class="row"><button class="btn sm" onclick="S.trip=S.saved[${i}];recalc(S.trip);pageNav('trip')">Open</button><button class="btn alt sm" onclick="S.saved.splice(${i},1);ls.set('pt_saved',S.saved);render()">Delete</button></div></div>`}).join(''):'<p class="mut">Nothing saved yet. Build a trip and press Save. Trips live only in this browser.</p>'}`}
const PAGES={home,explore,plan,trip,forts,food,saved:savedPg};
function render(){const P=[['home','Home'],['explore','Explore'],['plan','Plan a Trip'],['forts','Forts & Treks'],['food','Food & Stay'],['saved','Saved Trips']];
 $('#nav').innerHTML=P.map(([k,l])=>`<button onclick="pageNav('${k}')" ${S.page==k?'aria-current="page"':''}>${l}</button>`).join('');
 const st=document.activeElement;try{$('#app').innerHTML=PAGES[S.page]()}catch(e){$('#app').innerHTML='<div class="warn">Something went wrong rendering this page.</div>'}}
render();
</script></body></html>
