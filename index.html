<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PuneTrail: Explore Pune. Discover Forts. Find Your Trail.</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="stylesheet" href="styles.css">
<script src="vendor/leaflet/leaflet.js"></script>
</head><body>
<a class="skip" href="#main">Skip to content</a>
<header><button id="auth-btn" class="btn alt sm" type="button" style="float:right;display:none">Sign in</button><b>⛰ PuneTrail</b><small>Explore Pune. Discover Forts. Find Your Trail.</small></header>
<main id="main">
<h1>Explore map</h1>
<div id="filters" class="row" role="group" aria-label="Filter by category"></div>
<div class="row"><button id="geo" class="btn alt sm" type="button">📍 Use my location (optional)</button><span id="geo-msg" class="mut" role="status"></span></div>
<div id="map-error" class="warn" role="alert" hidden></div>
<div id="map" role="region" aria-label="Interactive map of Pune destinations. A full list follows below."></div>
<p class="mut"><span id="legend" class="legend"></span></p>
<p class="mut small" id="attrib"></p>
<div class="layout"><section aria-labelledby="lh"><h2 id="lh">Destinations</h2><div id="list" class="grid"></div></section>
<aside id="trip" class="card" aria-live="polite"></aside></div>
<p><button id="clear" class="btn alt sm" type="button">Clear trip</button></p>
</main></body>
<script type="module" src="src/main.js"></script>
<script type="module" src="src/firebase/authButton.js"></script></html>
